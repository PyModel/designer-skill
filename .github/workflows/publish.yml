name: Publish

# Runs on the tag pushed by scripts/release.sh. `verify` builds and tests a
# clean checkout of the tag and packs it; `npm` publishes that exact tarball;
# `registry` and `github-release` follow as separate jobs, so "Re-run failed
# jobs" repeats only the step that failed. npm and GitHub steps also skip work
# that is already done.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs all dependency code (install, build, tests, smoke) with no OIDC
  # credential; hands the exact tarball it verified to the publish job.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Tag matches every version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/versions.mjs check
          test "$TAG" = "v$(node -p "require('./designer-skill-mcp/package.json').version")"

      - name: Build and verify
        working-directory: designer-skill-mcp
        run: |
          npm ci
          npm run build
          git diff --exit-code -- assets/
          node --test checks/core.mjs
          npm test
          node scripts/smoke-tarball.mjs

      - name: Pack the verified tarball
        working-directory: designer-skill-mcp
        run: |
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pkg"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds id-token; runs no dependency code and restores no cache.
  npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write   # npm trusted publishing + provenance
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: pkg
      - name: Publish to npm with provenance
        env:
          TAG: ${{ github.ref_name }}
        # Trusted publishing (OIDC, no token): npmjs.com → package Settings → Trusted
        # publisher → GitHub Actions, PyModel/designer-skill, publish.yml, environment npm.
        # Provenance is attached automatically.
        run: |
          published() { npm view "@pymodel/designer-skill-mcp@${TAG#v}" version >/dev/null 2>&1; }
          if published; then echo "already on npm; skipping"; exit 0; fi
          if npm publish ./pkg/*.tgz --provenance --access public --ignore-scripts; then exit 0; fi
          # release.sh PUBLISH_LOCAL=1 may have published it already: npm processes
          # uploads asynchronously, so wait for the version instead of failing the race.
          echo "::warning::CI publish failed; waiting up to 10 min for a local publish"
          for _ in $(seq 60); do
            if published; then echo "published locally; skipping"; exit 0; fi
            sleep 10
          done
          echo "::error::${TAG#v} is not on npm: configure the trusted publisher or publish with PUBLISH_LOCAL=1"
          exit 1

  registry:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write   # MCP registry GitHub OIDC login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The registry grants this repo's OIDC identity io.github.PyModel/* (case-sensitive);
      # scripts/versions.mjs keeps server.json name and package.json mcpName on it.
      - name: Publish to the MCP registry
        working-directory: designer-skill-mcp
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher validate
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

  github-release:
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # the annotated tag object, for --notes-from-tag
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release exists; skipping"
          else
            gh release create "$TAG" --title "designer-skill-mcp $TAG" --notes-from-tag --verify-tag
          fi
